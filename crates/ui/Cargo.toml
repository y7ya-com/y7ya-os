[package]
name = "ui"
version = "0.1.0"
edition = "2024"
description = "A minimal GPU UI framework in the spirit of GPUI, shared by y7ya-os apps"

[dependencies]
arboard = { workspace = true }
bytemuck = { workspace = true }
cosmic-text = { workspace = true }
dirs = { workspace = true }
image = { workspace = true }
png = { workspace = true }
pollster = { workspace = true }
taffy = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }

# The layer-shell runner (menu bars, panels): winit can't make layer surfaces.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6.2"
smithay-client-toolkit = "0.19.2"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
