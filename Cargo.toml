[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "desktop"]

[workspace.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cosmic-text = "0.19.0"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2.191"
png = "0.18.1"
pollster = "1.0.1"
qrcode = { version = "0.14.1", default-features = false }
taffy = "0.15.1"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
winit = "0.30.13"

[profile.release]
lto = "thin"
strip = true

# The Android library: smaller code matters more than peak speed there.
[profile.android]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
