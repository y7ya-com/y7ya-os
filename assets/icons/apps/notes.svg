      <stop offset="1" stop-color="#fbd350"/>
    </linearGradient>
    <linearGradient id="binding" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4553b"/>
      <stop offset="1" stop-color="#a8331f"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a00" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7a4a00" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <use xlink:href="#shape" fill="url(#paper)" filter="url(#drop)"/>
