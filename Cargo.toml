[package]
name = "notes"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cosmic-text = "0.19.0"
dirs = "7.0.0"
png = "0.18.1"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
taffy = "0.15.1"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
winit = "0.30.13"

[profile.release]
lto = "thin"
strip = true
