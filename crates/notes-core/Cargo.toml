[package]
name = "notes-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
automerge = "0.12.0"
data-encoding = "2.11.1"
iroh = "1.4.1"
iroh-mdns-address-lookup = "0.6.1"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1.44"
