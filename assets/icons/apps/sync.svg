<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Sync with Phone: a phone circled by two sync arrows -->
  <defs>
    <!-- macOS icon template: 824px continuous-corner square, 100px margin -->
    <path id="shape" d="M640.6 100C722.2 100 763 104.1 799.8 112.1L806.9 113.9C854.9 131.3 892.7 169.1 910.1 217.1L911.9 224.2C919.9 261 924 301.8 924 383.4L924 640.6C924 722.2 919.9 763 911.9 799.8L910.1 806.9C892.7 854.9 854.9 892.7 806.9 910.1L799.8 911.9C763 919.9 722.2 924 640.6 924L383.4 924C301.8 924 261 919.9 224.2 911.9L217.1 910.1C169.1 892.7 131.3 854.9 113.9 806.9L112.1 799.8C104.1 763 100 722.2 100 640.6L100 383.4C100 301.8 104.1 261 112.1 224.2L113.9 217.1C131.3 169.1 169.1 131.3 217.1 113.9L224.2 112.1C261 104.1 301.8 100 383.4 100Z"/>
    <clipPath id="clip"><use xlink:href="#shape"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dy="12" stdDeviation="14" flood-opacity=".3"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dy="10" stdDeviation="12" flood-color="#04471c" flood-opacity=".35"/>
    </filter>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".3" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".75" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe38a"/>
      <stop offset="1" stop-color="#14a24a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3340"/>
      <stop offset="1" stop-color="#141920"/>
    </linearGradient>
  </defs>
  <use xlink:href="#shape" fill="url(#base)" filter="url(#drop)"/>
  <g filter="url(#lift)">
    <!-- the phone -->
    <rect x="392" y="300" width="240" height="424" rx="52" fill="#fff"/>
    <rect x="414" y="322" width="196" height="380" rx="34" fill="url(#screen)"/>
    <rect x="482" y="338" width="60" height="16" rx="8" fill="#fff" fill-opacity=".9"/>
    <!-- the arrows -->
    <g fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round">
      <path d="M678 274A290 290 0 0 1 758 666"/>
      <path d="M346 750A290 290 0 0 1 266 358"/>
    </g>
    <g fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round">
      <path d="M717 732L716 639L800 692Z"/>
      <path d="M307 292L308 385L224 332Z"/>
    </g>
  </g>
  <use xlink:href="#shape" fill="none" stroke="url(#rim)" stroke-width="8" clip-path="url(#clip)"/>
</svg>
