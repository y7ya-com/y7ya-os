# Which portal backends apps get inside y7ya-os (file pickers, "open with",
# settings, secrets). Installed to ~/.config/xdg-desktop-portal/; only read
# when XDG_CURRENT_DESKTOP is y7ya-os, so other desktops are unaffected.
# Light/dark and the accent come from y7ya-os itself (crates/y7-portal).
[preferred]
default=kde;gtk;
org.freedesktop.impl.portal.Settings=y7ya;gtk;
org.freedesktop.impl.portal.Secret=kwallet;
